<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 在首屏绘制前应用主题，避免暗色模式闪烁 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)" />
    <title>启点 · 个人智能工作区</title>
    <meta name="description" content="启点是一个统一助手与多种专业 Skill 协作的个人智能工作区。" />
    <meta name="author" content="启点" />
    <link rel="canonical" href="/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:title" content="启点 · 个人智能工作区" />
    <meta property="og:description" content="从一个问题开始，把思考推进到下一步。" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />

      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "启点",
        "applicationCategory": "AIChatBot",
        "operatingSystem": "Web",
        "description": "一个统一助手与多种专业 Skill 协作的个人智能工作区"
      }
    </script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

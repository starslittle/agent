services:
  gateway:
    build:
      context: .
      dockerfile: go-backend/Dockerfile
    container_name: qidian-gateway
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8000"
      PYTHON_BASE_URL: http://python:8000
      STATIC_DIR: /app/frontend/dist
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-qidian_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:?Set PUBLIC_ORIGINS to the public site origin}
      COOKIE_SECURE: "true"
      SESSION_TTL: ${SESSION_TTL:-168h}
      INTERNAL_AGENT_SECRET: ${INTERNAL_AGENT_SECRET:?Set INTERNAL_AGENT_SECRET in .env}
      # Human-gated rollout switch. Legacy and V1 share the same Python graph.
      AGENT_PROTOCOL_MODE: ${AGENT_PROTOCOL_MODE:-legacy}
      AGENT_RUN_DEADLINE: ${AGENT_RUN_DEADLINE:-5m}
      AGENT_CANCEL_TIMEOUT: ${AGENT_CANCEL_TIMEOUT:-5s}
      AGENT_RECONCILE_TIMEOUT: ${AGENT_RECONCILE_TIMEOUT:-5s}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      UPSTREAM_HEADER_TIMEOUT: ${UPSTREAM_HEADER_TIMEOUT:-30s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    depends_on:
      python:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "-", "http://localhost:8000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  python:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qidian-python
    expose:
      - "8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PORT: "8000"
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in .env}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      INTERNAL_AGENT_SECRET: ${INTERNAL_AGENT_SECRET:?Set INTERNAL_AGENT_SECRET in .env}
      AGENT_SERVICE_VERSION: ${AGENT_SERVICE_VERSION:-local}
      AGENT_RUNTIME_RETENTION_SECONDS: ${AGENT_RUNTIME_RETENTION_SECONDS:-1800}
      AGENT_RUNTIME_STORE: ${AGENT_RUNTIME_STORE:-memory}
      AGENT_RUNTIME_DATABASE_URL: ${AGENT_RUNTIME_DATABASE_URL:-}
      AGENT_RUNTIME_LEASE_SECONDS: ${AGENT_RUNTIME_LEASE_SECONDS:-30}
      AGENT_RUNTIME_EVENT_POLL_SECONDS: ${AGENT_RUNTIME_EVENT_POLL_SECONDS:-0.25}
      # Production schema setup is a separate reviewed deployment step.
      AGENT_RUNTIME_CHECKPOINT_SETUP: "false"
      AGENT_EXECUTION_ENGINE: langgraph_v1
      AGENT_RUNTIME_COORDINATION: ${AGENT_RUNTIME_COORDINATION:-none}
      AGENT_RUNTIME_REDIS_CHANNEL_PREFIX: ${AGENT_RUNTIME_REDIS_CHANNEL_PREFIX:-qidian:agent-runtime}
      AGENT_RUNTIME_MAINTENANCE_SECONDS: ${AGENT_RUNTIME_MAINTENANCE_SECONDS:-300}
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-qidian_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MODEL_PROVIDER: ${MODEL_PROVIDER:-dashscope_openai}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-120}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-deepseek-v4-flash}
    dns:
      - 223.5.5.5
    volumes:
      - ./backend/data:/app/data
      - ./backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg15
    container_name: qidian-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-qidian_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: qidian-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

services:
  gateway:
    build:
      context: .
      dockerfile: go-backend/Dockerfile
    container_name: qidian-gateway
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8000"
      PYTHON_BASE_URL: http://python:8000
      STATIC_DIR: /app/frontend/dist
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      UPSTREAM_HEADER_TIMEOUT: ${UPSTREAM_HEADER_TIMEOUT:-30s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    depends_on:
      python:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "-", "http://localhost:8000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  python:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: qidian-python
    expose:
      - "8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PORT: "8000"
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-qidian_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in .env}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SENIVERSE_API_KEY: ${SENIVERSE_API_KEY:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-deepseek-v3.2}
      REDIS_URL: redis://redis:6379/0
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    dns:
      - 223.5.5.5
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/storage:/app/backend/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg15
    container_name: qidian-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-qidian_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: qidian-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

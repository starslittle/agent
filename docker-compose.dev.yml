services:
  frontend:
    image: node:20-alpine
    working_dir: /workspace/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://gateway:8000
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: golang:1.25-alpine
    working_dir: /workspace/go-backend
    command: go run ./cmd/server
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8000"
      PYTHON_BASE_URL: http://python:8000
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-qidian_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      COOKIE_SECURE: "false"
      SESSION_TTL: ${SESSION_TTL:-168h}
      INTERNAL_AGENT_SECRET: ${INTERNAL_AGENT_SECRET:-development-only-agent-secret-change-me}
      AGENT_PROTOCOL_MODE: ${AGENT_PROTOCOL_MODE:-v1}
      AGENT_RUN_DEADLINE: ${AGENT_RUN_DEADLINE:-5m}
      AGENT_CANCEL_TIMEOUT: ${AGENT_CANCEL_TIMEOUT:-5s}
      AGENT_RECONCILE_TIMEOUT: ${AGENT_RECONCILE_TIMEOUT:-5s}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      UPSTREAM_HEADER_TIMEOUT: ${UPSTREAM_HEADER_TIMEOUT:-30s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    volumes:
      - ./go-backend:/workspace/go-backend
      - go_module_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      python:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "-", "http://localhost:8000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  python:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: "8000"
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in .env}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      INTERNAL_AGENT_SECRET: ${INTERNAL_AGENT_SECRET:-development-only-agent-secret-change-me}
      AGENT_SERVICE_VERSION: ${AGENT_SERVICE_VERSION:-dev}
      AGENT_RUNTIME_RETENTION_SECONDS: ${AGENT_RUNTIME_RETENTION_SECONDS:-1800}
      AGENT_RUNTIME_STORE: ${AGENT_RUNTIME_STORE:-memory}
      AGENT_RUNTIME_DATABASE_URL: ${AGENT_RUNTIME_DATABASE_URL:-}
      AGENT_RUNTIME_LEASE_SECONDS: ${AGENT_RUNTIME_LEASE_SECONDS:-30}
      AGENT_RUNTIME_EVENT_POLL_SECONDS: ${AGENT_RUNTIME_EVENT_POLL_SECONDS:-0.25}
      AGENT_RUNTIME_CHECKPOINT_SETUP: ${AGENT_RUNTIME_CHECKPOINT_SETUP:-false}
      AGENT_EXECUTION_ENGINE: langgraph_v1
      AGENT_RUNTIME_COORDINATION: ${AGENT_RUNTIME_COORDINATION:-none}
      AGENT_RUNTIME_REDIS_CHANNEL_PREFIX: ${AGENT_RUNTIME_REDIS_CHANNEL_PREFIX:-qidian:agent-runtime}
      AGENT_RUNTIME_MAINTENANCE_SECONDS: ${AGENT_RUNTIME_MAINTENANCE_SECONDS:-300}
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-qidian_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-deepseek-v4-flash}
    dns:
      - 223.5.5.5
    volumes:
      - ./backend:/app
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg15
    container_name: qidian-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-qidian_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: qidian-adminer-dev
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  frontend_node_modules:
  go_module_cache:
  go_build_cache:
  postgres_dev_data:

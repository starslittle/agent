services:
  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --reload --reload-dir /app/backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: ${PORT:-8000}
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-qidian_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in .env}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SENIVERSE_API_KEY: ${SENIVERSE_API_KEY:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-deepseek-v3.2}
      REDIS_URL: redis://redis:6379/0
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    dns:
      - 223.5.5.5
    volumes:
      - ./backend:/app/backend
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen(f'http://localhost:{os.getenv(\"PORT\", \"8000\")}/healthz', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg15
    container_name: qidian-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-qidian_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_dev_data:

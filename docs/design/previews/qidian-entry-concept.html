<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="启点未登录对话入口视觉概念稿">
    <meta name="theme-color" content="#fafaf8">
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='9' cy='16' r='5' fill='%23c76b42'/%3E%3Cpath d='M14 16h7' stroke='%23356658' stroke-width='2'/%3E%3Ccircle cx='24' cy='16' r='4' fill='none' stroke='%23356658' stroke-width='2'/%3E%3C/svg%3E"
    >
    <title>启点 · 从一个问题开始</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #fafaf8;
        --surface: #ffffff;
        --surface-muted: #f2f3f1;
        --ink: #1d2421;
        --muted: #6c736f;
        --muted-strong: #505853;
        --primary: #356658;
        --primary-hover: #2c564a;
        --primary-soft: #e5efeb;
        --start: #c76b42;
        --border: #e1e5e2;
        --border-strong: #cfd5d1;
        --danger: #a43f37;
        --focus: #245447;
        --shadow: 0 16px 48px rgba(29, 36, 33, 0.08);
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 18px;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --canvas: #111412;
        --surface: #171a18;
        --surface-muted: #1c201d;
        --ink: #e7ebe8;
        --muted: #989f9a;
        --muted-strong: #bdc3bf;
        --primary: #83b3a4;
        --primary-hover: #9ac5b7;
        --primary-soft: #20362f;
        --start: #dc8a63;
        --border: #2b302d;
        --border-strong: #3d4540;
        --danger: #ec8a82;
        --focus: #a6d3c1;
        --shadow: 0 18px 56px rgba(0, 0, 0, 0.25);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        min-height: 100%;
        background: var(--canvas);
      }

      body {
        margin: 0;
        min-height: 100dvh;
        overflow-x: hidden;
        background: var(--canvas);
        color: var(--ink);
        font-family:
          Inter, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Microsoft YaHei",
          sans-serif;
        font-size: 16px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: rgba(53, 102, 88, 0.14);
      }

      button,
      textarea {
        color: inherit;
        font: inherit;
      }

      button,
      a {
        touch-action: manipulation;
      }

      button {
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      button:focus-visible,
      a:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }

      .skip-link {
        position: fixed;
        top: 12px;
        left: 16px;
        z-index: 100;
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        background: var(--ink);
        color: var(--surface);
        transform: translateY(-160%);
        transition: transform 160ms var(--ease);
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .page {
        display: grid;
        min-height: 100dvh;
        grid-template-rows: auto 1fr auto;
      }

      .site-header,
      .site-footer {
        display: flex;
        width: min(100%, 1180px);
        align-items: center;
        justify-content: space-between;
        margin: 0 auto;
        padding-right: 28px;
        padding-left: 28px;
      }

      .site-header {
        min-height: 76px;
        padding-top: max(12px, env(safe-area-inset-top));
      }

      .brand {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        gap: 11px;
      }

      .brand-mark {
        position: relative;
        width: 40px;
        height: 28px;
        flex: 0 0 40px;
      }

      .brand-mark::before {
        position: absolute;
        top: 13px;
        left: 8px;
        width: 24px;
        height: 1px;
        background: var(--primary);
        content: "";
      }

      .brand-dot,
      .brand-node {
        position: absolute;
        top: 8px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }

      .brand-dot {
        left: 2px;
        background: var(--start);
      }

      .brand-node {
        right: 0;
        border: 1.5px solid var(--primary);
        background: var(--canvas);
      }

      .brand-name {
        font-size: 18px;
        font-weight: 720;
        letter-spacing: 0.02em;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .theme-button,
      .login-link {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-md);
        transition:
          border-color 180ms var(--ease),
          background-color 180ms var(--ease),
          color 180ms var(--ease);
      }

      .theme-button {
        width: 44px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted-strong);
      }

      .theme-button:hover {
        border-color: var(--border);
        background: var(--surface-muted);
        color: var(--ink);
      }

      .theme-button svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }

      .sun-icon {
        display: none;
      }

      html[data-theme="dark"] .moon-icon {
        display: none;
      }

      html[data-theme="dark"] .sun-icon {
        display: block;
      }

      .login-link {
        min-width: 74px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--ink);
        font-size: 13px;
        font-weight: 620;
      }

      .login-link:hover {
        border-color: var(--primary);
        background: var(--primary-soft);
        color: var(--primary);
      }

      .entry-main {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: center;
        padding: 56px 24px 72px;
      }

      .entry-content {
        width: min(100%, 720px);
        margin-top: -5vh;
        text-align: center;
      }

      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 18px;
        color: var(--primary);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.06em;
      }

      .kicker::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--start);
        content: "";
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 4.2vw, 48px);
        font-weight: 680;
        letter-spacing: -0.045em;
        line-height: 1.18;
        text-wrap: balance;
      }

      .intro-copy {
        max-width: 560px;
        margin: 16px auto 0;
        color: var(--muted-strong);
        font-size: 15px;
        line-height: 1.75;
        text-wrap: pretty;
      }

      .composer {
        margin-top: 38px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        background: var(--surface);
        padding: 16px 14px 12px 18px;
        box-shadow: var(--shadow);
        text-align: left;
        transition:
          border-color 180ms var(--ease),
          box-shadow 180ms var(--ease);
      }

      .composer:focus-within {
        border-color: var(--primary);
        box-shadow:
          0 0 0 3px color-mix(in srgb, var(--primary) 16%, transparent),
          var(--shadow);
      }

      .composer textarea {
        display: block;
        width: 100%;
        min-height: 76px;
        max-height: 180px;
        resize: vertical;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font-size: 16px;
        line-height: 1.65;
      }

      .composer textarea::placeholder {
        color: var(--muted);
      }

      .composer-footer {
        display: flex;
        min-height: 46px;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .login-hint {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .login-hint svg {
        width: 15px;
        height: 15px;
        flex: 0 0 15px;
        fill: none;
        stroke: var(--primary);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }

      .send-button {
        display: grid;
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        place-items: center;
        border: 1px solid var(--primary);
        border-radius: var(--radius-md);
        background: var(--primary);
        color: #ffffff;
        transition:
          border-color 180ms var(--ease),
          background-color 180ms var(--ease),
          transform 180ms var(--ease);
      }

      html[data-theme="dark"] .send-button {
        color: #111412;
      }

      .send-button:hover {
        border-color: var(--primary-hover);
        background: var(--primary-hover);
        transform: translateY(-1px);
      }

      .send-button:active {
        transform: translateY(0);
      }

      .send-button svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .composer-error {
        min-height: 20px;
        margin: 8px 4px -3px;
        color: var(--danger);
        font-size: 12px;
        text-align: left;
      }

      .suggestions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 20px;
      }

      .suggestion {
        min-height: 42px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: transparent;
        color: var(--muted-strong);
        font-size: 13px;
        transition:
          border-color 180ms var(--ease),
          background-color 180ms var(--ease),
          color 180ms var(--ease);
      }

      .suggestion:hover {
        border-color: var(--border-strong);
        background: var(--surface-muted);
        color: var(--ink);
      }

      .site-footer {
        min-height: 64px;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
        color: var(--muted);
        font-size: 11px;
      }

      .site-footer p {
        margin: 0;
      }

      @media (max-width: 640px) {
        .site-header {
          min-height: 68px;
          padding-right: 16px;
          padding-left: 16px;
        }

        .brand-mark {
          width: 37px;
          flex-basis: 37px;
        }

        .entry-main {
          align-items: flex-start;
          padding: 13vh 16px 48px;
        }

        .entry-content {
          margin-top: 0;
        }

        h1 {
          font-size: clamp(30px, 9vw, 38px);
        }

        .intro-copy {
          max-width: 340px;
          font-size: 14px;
        }

        .composer {
          margin-top: 30px;
          padding: 14px 12px 10px 15px;
        }

        .composer textarea {
          min-height: 68px;
        }

        .login-hint {
          max-width: 235px;
          line-height: 1.45;
        }

        .suggestions {
          justify-content: flex-start;
          overflow-x: auto;
          flex-wrap: nowrap;
          padding-bottom: 3px;
          scrollbar-width: none;
        }

        .suggestions::-webkit-scrollbar {
          display: none;
        }

        .suggestion {
          flex: 0 0 auto;
        }

        .site-footer {
          justify-content: center;
          min-height: 52px;
          padding-right: 16px;
          padding-left: 16px;
          text-align: center;
        }

        .site-footer p:last-child {
          display: none;
        }
      }

      @media (max-height: 620px) and (min-width: 641px) {
        .entry-main {
          align-items: flex-start;
          padding-top: 34px;
          padding-bottom: 34px;
        }

        .entry-content {
          margin-top: 0;
        }

        .composer {
          margin-top: 24px;
        }

        .suggestions {
          margin-top: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#message">跳到问题输入框</a>

    <div class="page">
      <header class="site-header">
        <a class="brand" href="./qidian-entry-concept.html" aria-label="启点对话入口">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-dot"></span>
            <span class="brand-node"></span>
          </span>
          <span class="brand-name" translate="no">启点</span>
        </a>

        <div class="header-actions">
          <button
            class="theme-button"
            id="theme-toggle"
            type="button"
            aria-label="切换到深色主题"
            aria-pressed="false"
          >
            <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.4 15.4A8.5 8.5 0 0 1 8.6 3.6 8.5 8.5 0 1 0 20.4 15.4Z"></path>
            </svg>
            <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.8"></circle>
              <path d="M12 2.5v2M12 19.5v2M21.5 12h-2M4.5 12h-2M18.72 5.28l-1.42 1.42M6.7 17.3l-1.42 1.42M18.72 18.72l-1.42-1.42M6.7 6.7 5.28 5.28"></path>
            </svg>
          </button>
          <a class="login-link" id="login-link" href="./qidian-login-concept.html">登录</a>
        </div>
      </header>

      <main class="entry-main">
        <section class="entry-content" aria-labelledby="entry-title">
          <p class="kicker">从一个问题开始</p>
          <h1 id="entry-title">今天想从哪件事开始？</h1>
          <p class="intro-copy">
            登录后，启点会结合你确认过的信息，陪你分析、记录并继续复盘。
          </p>

          <form class="composer" id="entry-form" novalidate>
            <label class="sr-only" for="message">说说你正在考虑的问题</label>
            <textarea
              id="message"
              name="message"
              maxlength="4000"
              placeholder="说说你正在考虑的问题…"
              aria-describedby="login-hint composer-error"
            ></textarea>
            <div class="composer-footer">
              <span class="login-hint" id="login-hint">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                  <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                </svg>
                登录后发送并保存到你的启点空间
              </span>
              <button class="send-button" type="submit" aria-label="登录并继续发送">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 12h13M14 7l5 5-5 5"></path>
                </svg>
              </button>
            </div>
            <p class="composer-error" id="composer-error" aria-live="polite"></p>
          </form>

          <div class="suggestions" aria-label="示例问题">
            <button class="suggestion" type="button" data-prompt="帮我梳理下一轮面试的准备优先级">梳理面试准备</button>
            <button class="suggestion" type="button" data-prompt="帮我检索并整理这个问题的可靠资料">检索一个问题</button>
            <button class="suggestion" type="button" data-prompt="结合我之前的信息，分析这个选择的利弊">分析一个选择</button>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p>未登录状态不会执行 Agent，也不会上传输入内容</p>
        <p>启点 · 个人 AI Wiki 与决策副驾驶</p>
      </footer>
    </div>

    <script>
      const root = document.documentElement;
      const themeToggle = document.querySelector("#theme-toggle");
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const form = document.querySelector("#entry-form");
      const message = document.querySelector("#message");
      const error = document.querySelector("#composer-error");
      const loginLink = document.querySelector("#login-link");

      function readSession(key) {
        try {
          return window.sessionStorage.getItem(key);
        } catch {
          return null;
        }
      }

      function writeSession(key, value) {
        try {
          window.sessionStorage.setItem(key, value);
        } catch {
          return;
        }
      }

      function removeSession(key) {
        try {
          window.sessionStorage.removeItem(key);
        } catch {
          return;
        }
      }

      function applyTheme(theme) {
        const isDark = theme === "dark";
        root.dataset.theme = isDark ? "dark" : "light";
        themeToggle.setAttribute("aria-pressed", String(isDark));
        themeToggle.setAttribute("aria-label", isDark ? "切换到浅色主题" : "切换到深色主题");
        themeColor.setAttribute("content", isDark ? "#111412" : "#fafaf8");
        writeSession("qidian_preview_theme", isDark ? "dark" : "light");
      }

      const savedTheme = readSession("qidian_preview_theme");
      const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
      applyTheme(savedTheme || preferredTheme);

      themeToggle.addEventListener("click", () => {
        applyTheme(root.dataset.theme === "dark" ? "light" : "dark");
      });

      loginLink.addEventListener("click", () => {
        removeSession("qidian_pending_prompt");
      });

      document.querySelectorAll(".suggestion").forEach((button) => {
        button.addEventListener("click", () => {
          message.value = button.dataset.prompt;
          error.textContent = "";
          message.focus();
        });
      });

      message.addEventListener("input", () => {
        if (message.value.trim()) error.textContent = "";
      });

      message.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const prompt = message.value.trim();
        if (!prompt) {
          error.textContent = "先写下一个问题，再登录继续。";
          message.focus();
          return;
        }
        writeSession("qidian_pending_prompt", prompt);
        window.location.href = "./qidian-login-concept.html#continue";
      });
    </script>
  </body>
</html>

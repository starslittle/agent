agents:
  - name: default_llm_agent
    description: 默认低延迟对话，不使用工具。
    is_default: true
    workflow: chat_v1
    model_profile: default_chat
    prompt_bundle: chat_v1
    allowed_capabilities: []
    budgets:
      deadline_seconds: 60
      max_model_calls: 2
      max_tool_calls: 0

  - name: research_agent
    description: 基于结构化计划和来源证据完成开放式调研。
    is_default: false
    workflow: research_v1
    model_profile: default_reasoning
    prompt_bundle: research_v1
    allowed_capabilities:
      - tavily_search
    budgets:
      deadline_seconds: 180
      max_model_calls: 8
      max_tool_calls: 5

  - name: fortune_agent
    description: 先校验出生资料并确定性排盘，再做不确定性明确的命理解读。
    is_default: false
    workflow: fortune_v1
    model_profile: default_reasoning
    prompt_bundle: fortune_v1
    allowed_capabilities:
      - get_current_date
      - get_lunar_chart
      - get_ziwei_chart
    budgets:
      deadline_seconds: 180
      max_model_calls: 6
      max_tool_calls: 3

aliases:
  default: default_llm_agent
  chat: default_llm_agent
  chat_v1: default_llm_agent
  research: research_agent
  research_v1: research_agent
  general_rag_agent: research_agent
  fortune: fortune_agent
  fortune_v1: fortune_agent

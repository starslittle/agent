skills:
  - id: research
    version: 1
    title: 深度研究
    description: 基于结构化计划和可追溯来源完成开放式调研。
    workflow: research_v1
    input_schema: ResearchInput
    output_schema: ResearchResult
    allowed_capabilities:
      - tavily_search
    model_requirements:
      streaming: true
      structured_output: true
      tool_calling: true
    budgets:
      deadline_seconds: 180
      max_model_calls: 8
      max_tool_calls: 5
    risk:
      tier: low
      explicit_confirmation: never
    memory:
      may_propose_updates: false
      may_commit_updates: false
    ui:
      command: /research
      visible: true
    public:
      purpose: 面向需要外部资料的问题，先拆分研究步骤，再检索、核验并综合可追溯来源。
      context_scope:
        - confirmed_fact
        - current_state
        - personal_rule
      confirmation_summary: 可由你明确选择或由启点自动识别；不会替你确认个人信息更新。
    available: true

  - id: fortune
    version: 1
    title: 命理分析
    description: 使用确定性排盘和受控解释提供命理视角。
    workflow: fortune_v1
    input_schema: FortuneInput
    output_schema: FortuneResult
    allowed_capabilities:
      - get_current_date
      - get_lunar_chart
      - get_ziwei_chart
    model_requirements:
      streaming: true
      structured_output: true
      tool_calling: true
    budgets:
      deadline_seconds: 180
      max_model_calls: 6
      max_tool_calls: 3
    risk:
      tier: medium
      explicit_confirmation: contextual
    memory:
      may_propose_updates: true
      may_commit_updates: false
    ui:
      command: /fortune
      visible: true
    public:
      purpose: 根据你主动提供的出生信息完成确定性排盘，并以受控叙事提供辅助分析视角。
      context_scope:
        - confirmed_fact
        - current_state
        - personal_rule
      confirmation_summary: 明确选择时直接进入；自动识别时需要你确认，命理叙事不会自动写入长期上下文。
    available: true
